      <text x="58" y="16" fill="#7188A1" font-size="17" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">训练</text>
      <text x="116" y="16" fill="#7188A1" font-size="17" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">我的</text>
