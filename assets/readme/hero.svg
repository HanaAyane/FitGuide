      从动作参考，到完整训练记录。
    </text>
    <text x="0" y="176" fill="#A0B1C9" font-size="21" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      1324 个动作 · 中英并排 · 训练闭环
    </text>

    <g transform="translate(0 207)">
      <rect x="0" y="0" width="102" height="36" rx="18" fill="#153247" stroke="#48D7F2" stroke-opacity="0.42"/>
      <text x="51" y="24" text-anchor="middle" fill="#D7F7FF" font-size="17" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">iOS 18+</text>
      <rect x="114" y="0" width="194" height="36" rx="18" fill="#122338" stroke="#89A1C0" stroke-opacity="0.34"/>
      <text x="211" y="24" text-anchor="middle" fill="#C2D1E5" font-size="17" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">SwiftUI + SwiftData</text>
      <rect x="320" y="0" width="78" height="36" rx="18" fill="#211F46" stroke="#8E83FF" stroke-opacity="0.55"/>
      <text x="359" y="24" text-anchor="middle" fill="#E5E1FF" font-size="17" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v2.0</text>
