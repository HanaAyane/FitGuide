    <g transform="translate(40 322)">
      <circle cx="10" cy="0" r="4" fill="#48D7F2"/>
      <circle cx="178" cy="0" r="4" fill="#7188A1"/>
      <circle cx="346" cy="0" r="4" fill="#7188A1"/>
      <path d="M28 0H160M196 0H328" stroke="#7191A9" stroke-opacity="0.35"/>
    </g>
