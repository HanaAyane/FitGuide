      <path d="M4 10H16M10 4V16" stroke="#041017" stroke-width="2" stroke-linecap="round"/>
      <text x="30" y="16" fill="#F6F8FB" font-size="20" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">FitGuide</text>
      <rect x="280" y="-2" width="100" height="26" rx="13" fill="#143346"/>
      <circle cx="295" cy="11" r="4" fill="#48D7F2"/>
