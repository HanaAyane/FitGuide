<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="468" viewBox="0 0 1200 468"
     role="img" aria-labelledby="title desc" xml:lang="zh-Hans">
  <title id="title">FitGuide · 健身动作指导</title>
  <desc id="desc">1324 个离线动作，提供中英对照步骤。右侧为原创哑铃深蹲动作分解插画。</desc>

  <defs>
    <clipPath id="canvas"><rect width="1200" height="468" rx="28"/></clipPath>
    <radialGradient id="spotlight" cx=".83" cy=".46" r=".59">
      <stop stop-color="#1B4440"/>
      <stop offset=".6" stop-color="#102326"/>
      <stop offset="1" stop-color="#0B1218"/>
    </radialGradient>
    <linearGradient id="shirt" x1=".68" y1="0" x2=".26" y2="1">
      <stop stop-color="#A2F8DB"/>
      <stop offset=".56" stop-color="#51D3B2"/>
      <stop offset="1" stop-color="#237E73"/>
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#384B53"/>
      <stop offset="1" stop-color="#17242D"/>
    </linearGradient>
    <linearGradient id="skin" x1=".66" y1="0" x2=".28" y2="1">
      <stop stop-color="#FFD2B5"/>
      <stop offset="1" stop-color="#B77560"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8"
            refX="8" refY="5" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#80EBD2" stroke-width="1.3"/>
    </marker>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="468" fill="url(#spotlight)"/>
    <path d="M710 468 955 0h191L901 468z" fill="#80EBD2" opacity=".045"/>
    <path d="M708 468 953 0m-179 468L1019 0m-101 468L1163 0" fill="none"
          stroke="#97CFC4" opacity=".14"/>
    <path d="M58 91h1084M58 389h1084" fill="none" stroke="#97CFC4" opacity=".25"/>

    <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
      <g id="masthead" transform="translate(58 32)">
        <rect width="39" height="39" rx="11" fill="#83F2D3"/>
        <path d="M11 25l17-11M10 18l7 11m-11-9 6 10m10-19 7 11m-3-14 7 11"
              fill="none" stroke="#13292A" stroke-width="2.5" stroke-linecap="round"/>
        <text x="54" y="27" fill="#D4E6E2" font-size="21" font-weight="700">iPhone 动作库</text>
      </g>

      <g id="identity">
        <text x="52" y="227" fill="#F2FFF9" font-size="138" font-weight="800"
              letter-spacing="-8">FitGuide</text>
        <text x="59" y="296" fill="#83F2D3" font-size="51" font-weight="700"
              letter-spacing="2">健身动作指导</text>
        <text x="62" y="344" fill="#C3D7D5" font-size="26">中英对照步骤 · GIF 循环示范</text>
      </g>

      <g id="facts">
        <text x="58" y="439" fill="#F2FFF9" font-size="37" font-weight="700">1,324</text>
        <text x="170" y="437" fill="#C3D7D5" font-size="23">个离线动作</text>
        <text x="1141" y="437" text-anchor="end" fill="#C3D7D5" font-size="23">哑铃深蹲</text>
      </g>
    </g>

    <g id="movement-study">
      <path d="M782 120c-74 12-96 68-49 100 14 10 31 16 54 19"
            fill="none" stroke="#80EBD2" stroke-width="1.7" stroke-dasharray="5 7"
            marker-end="url(#arrow)" opacity=".8"/>
      <path d="M750 378h354m-314-5v10m291-10v10" stroke="#80EBD2" opacity=".4" fill="none"/>

      <!-- Standing phase, drawn as a contour so the lowered phase stays in focus. -->
      <g id="standing" fill="#80EBD2" fill-opacity=".045" stroke="#80EBD2"
         stroke-opacity=".36" stroke-width="1.5" stroke-linejoin="round">
        <path d="M810 102c-12-6-19-18-16-32 3-16 17-25 33-23 15 1 25 10 27 24
                 l8 11-7 5-2 11c-2 6-9 9-17 7l1 13-26 5z"/>
        <path d="M813 112c-16 9-24 31-26 53l-7 61 61 2 9-60 23 20
                 c7 5 17 2 22-5l26-32-13-12-27 26-28-39c-10-14-24-21-40-14z"/>
        <path d="M782 225h58l3 65-9 71 24 6c6 2 7 7 4 11h-51l-2-15 3-76-15-1-2 75
                 21 8v9h-46l-3-15 4-78z"/>
        <path d="M910 132h16v23h-16z"/>
        <path d="M793 226h37m-39 59h41" fill="none"/>
      </g>

      <!-- Lowered phase. Rear limbs are painted first. -->
      <g id="lowered" stroke-linejoin="round">
        <path d="M1029 345c7 3 13 8 25 11l21 3c6 1 9 5 7 10h-67
                 c-5 0-7-4-5-9l6-18z" fill="#638189" stroke="#93AFAF" stroke-width="1.4"/>
        <path d="M979 262c11-8 29-9 41 1 10 8 17 19 18 33l-8 51
                 c-2 8-16 9-24 1l-5-51-29-15z" fill="#986957" stroke="#D59A7F" stroke-width="1.3"/>
        <path d="M870 242c34-1 72 0 103 4 19 2 34 9 43 22l-22 36-36-7-77 3
                 c-16-1-29-11-31-24-3-14 5-28 20-34z" fill="#23353F" stroke="#6D858B" stroke-width="1.5"/>
        <path d="M936 146c12-5 26 2 33 15l17 32 39-49 15 8-35 65
                 c-5 11-17 14-27 8l-14-10-33-41z" fill="#A37261" stroke="#D8A18B" stroke-width="1.4"/>

        <!-- Near leg and shoe. -->
        <path d="M966 273c19-7 33 3 35 16 2 15-9 35-20 51l-15 24
                 c-5 8-18 9-26 3-4-3-4-8-2-12l12-42 5-26z"
              fill="url(#skin)" stroke="#E6A78B" stroke-width="1.6"/>
        <path d="M941 355l17 2 12 6 29 3c9 1 14 6 14 12h-77
                 c-5 0-7-4-6-9l3-10z" fill="#E5F2E9" stroke="#B5D8CD" stroke-width="1.4"/>
        <path d="M930 372c23 2 50 1 81 0l2 6h-77c-4 0-6-2-6-6z" fill="#64958D"/>
        <path d="M965 361l-4 7m12-5-3 6" fill="none" stroke="#56837F" stroke-width="1.8"/>

        <path d="M866 235c17-4 39 4 55 8l56 9c17 3 29 18 26 34l-5 18
                 c-14 5-29 2-44-4l-72 8c-28 3-48-9-49-31-2-19 12-36 33-42z"
              fill="url(#shorts)" stroke="#80969C" stroke-width="1.7"/>
        <path d="M852 278c14 16 46 15 67 11l48-8m-13 19c11-8 17-19 19-26m17 29 4-10"
              fill="none" stroke="#78AAAC" stroke-opacity=".5" stroke-width="1.5"/>

        <!-- Neck and profile. -->
        <path d="M941 134l14-17 24 12-12 25-7 13-26-13z" fill="url(#skin)"
              stroke="#DB9F87" stroke-width="1.5"/>
        <path d="M954 106c1-17 16-32 33-31 18 0 32 13 33 28l-2 9 7 11
                 c1 2-1 4-4 5l-5 1-2 12c-1 7-8 11-15 9l-14-5-12-11
                 c-10-2-18-13-19-28z" fill="url(#skin)" stroke="#F3BFA8" stroke-width="1.6"/>
        <path d="M955 117c-5-7-8-20-4-30 5-13 20-22 37-21 17 1 32 11 34 25
                 -10 4-19 2-25-4-4 10-12 17-23 19l-4 13-7 5z"
              fill="#18262D" stroke="#526F72" stroke-width="1.5"/>
        <path d="M960 91c6-11 20-16 34-14m17 33-6 1m5 25-6-1"
              stroke="#6E514C" stroke-width="1.8" fill="none" stroke-linecap="round"/>

        <path d="M941 132c-22-5-40 9-54 31-12 18-19 44-44 70l-9 21
                 c16 12 43 16 64 9 18-5 26-18 39-36l32-40c9-14 6-29-7-43z"
              fill="url(#shirt)" stroke="#A7F8DE" stroke-width="1.7"/>
        <path d="M944 138c-10 5-18 10-25 20m-38 62c15-10 34-34 43-53m-84 78
                 c19 9 37 10 55 4m-7 2 10-11" fill="none" stroke="#226C63"
              stroke-width="1.8" stroke-opacity=".7"/>

        <!-- Vertical dumbbell, then the near hand around its handle. -->
        <g transform="rotate(13 1039 149)">
          <path d="M1035 129h9v39h-9z" fill="#8EC9BE" stroke="#183539" stroke-width="2"/>
          <path d="M1024 117h28l5 6v10l-5 5h-28l-5-5v-10zm0 44h28l5 5v10l-5 6h-28l-5-6v-10z"
                fill="#17272F" stroke="#9ACABC" stroke-width="1.6"/>
          <path d="M1026 123h21m-21 44h21" stroke="#65958D" stroke-width="1.7"/>
        </g>
        <path d="M953 160c12-5 23 2 28 14l11 27 31-41 2-10c1-5 6-9 12-8
                 l11 4c3 1 4 4 2 7l-6 10-8 5-30 58c-5 9-15 11-24 8-7-2-14-9-18-16
                 l-23-31c-8-12-2-22 12-27z" fill="url(#skin)" stroke="#F0B396" stroke-width="1.6"/>
        <path d="M952 156c12-5 24 0 31 11l8 15c-9 10-22 15-42 16l-12-16
                 c-7-11 3-21 15-26z" fill="url(#shirt)" stroke="#A7F8DE" stroke-width="1.5"/>
        <path d="M945 190c16-2 30-7 41-15" fill="none" stroke="#317C70" stroke-width="1.6"/>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="467" rx="27.5" fill="none"
        stroke="#90BEBA" stroke-opacity=".25"/>
</svg>
