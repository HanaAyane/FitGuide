      <path d="M110 0H148" stroke="#6A8CA6" stroke-opacity="0.62"/>
      <circle cx="158" cy="0" r="5" fill="#6EA7FF"/>
      <text x="174" y="6" fill="#C7D8E7" font-size="16" font-weight="650" letter-spacing="1.1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PLAN</text>
      <path d="M238 0H276" stroke="#6A8CA6" stroke-opacity="0.62"/>
      <circle cx="286" cy="0" r="5" fill="#8E83FF"/>
      <text x="302" y="6" fill="#C7D8E7" font-size="16" font-weight="650" letter-spacing="1.1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOG</text>
      <path d="M354 0H392" stroke="#6A8CA6" stroke-opacity="0.62"/>
      <circle cx="402" cy="0" r="5" fill="#48D7F2"/>
      <text x="418" y="6" fill="#C7D8E7" font-size="16" font-weight="650" letter-spacing="1.1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">REVIEW</text>
    </g>
