      <text x="238" y="16" fill="#87A2BB" font-size="14" font-weight="600" letter-spacing="1.1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FLOW / 结构示意</text>
    </g>

    <g transform="translate(40 138)">
      <rect x="0" y="0" width="372" height="84" rx="20" fill="#142A40" stroke="#9AC6D9" stroke-opacity="0.2"/>
      <circle cx="42" cy="42" r="25" fill="#0C1D2F" stroke="#48D7F2" stroke-opacity="0.55"/>
      <g transform="translate(25 41) rotate(-22)">
        <rect x="0" y="-3" width="34" height="6" rx="3" fill="#D4F8FF"/>
        <rect x="-8" y="-11" width="6" height="22" rx="2" fill="#48D7F2"/>
        <rect x="-15" y="-8" width="5" height="16" rx="2" fill="#79E5F5"/>
        <rect x="36" y="-11" width="6" height="22" rx="2" fill="#48D7F2"/>
        <rect x="43" y="-8" width="5" height="16" rx="2" fill="#79E5F5"/>
      </g>
      <text x="84" y="32" fill="#F6F8FB" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">杠铃卧推</text>
      <text x="84" y="57" fill="#9FB0CA" font-size="16" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Barbell Bench Press</text>
      <rect x="282" y="26" width="72" height="28" rx="14" fill="#203B50"/>
      <text x="318" y="45" text-anchor="middle" fill="#BDECF7" font-size="14" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">胸 / CHEST</text>
    </g>

    <g transform="translate(40 238)">
      <rect x="0" y="0" width="178" height="72" rx="18" fill="#10253A" stroke="#81B8CD" stroke-opacity="0.24"/>
      <text x="16" y="22" fill="#A8C1D1" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">训练中</text>
      <text x="16" y="45" fill="#48D7F2" font-size="16" font-weight="700" letter-spacing="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SET 02 / 03</text>
      <text x="136" y="48" fill="#F6F8FB" font-size="24" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">12</text>
      <text x="151" y="60" fill="#7F96AB" font-size="11" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">REPS</text>

      <rect x="194" y="0" width="178" height="72" rx="18" fill="#0D1A2A" stroke="#9C8FFF" stroke-opacity="0.24"/>
      <text x="210" y="22" fill="#A8C1D1" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">休息</text>
      <text x="210" y="52" fill="#F6F8FB" font-size="31" font-weight="750" letter-spacing="-0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01:30</text>
      <text x="326" y="22" fill="#C3BFFF" font-size="13" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">+15s</text>
      <text x="326" y="61" fill="#7F96AB" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">跳过</text>
