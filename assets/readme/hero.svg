<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">FitGuide：离线动作参考与训练记录</title>
  <desc id="desc">深空 Liquid Glass 风格的 FitGuide 产品结构示意，展示双语动作卡片、逐组训练记录与休息计时。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2030"/>
      <stop offset="0.54" stop-color="#071420"/>
      <stop offset="1" stop-color="#020609"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C3850" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0A1422" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48D7F2"/>
      <stop offset="1" stop-color="#8E83FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#background)"/>
  <circle cx="1085" cy="52" r="220" fill="#48D7F2" opacity="0.075"/>
  <circle cx="220" cy="438" r="220" fill="#7164FF" opacity="0.075"/>
  <path d="M56 306H606M56 324H486" stroke="#A7C6D8" stroke-opacity="0.12"/>
  <path d="M640 26V394" stroke="#A7C6D8" stroke-opacity="0.10"/>
  <path d="M56 34H574" stroke="#A7C6D8" stroke-opacity="0.10"/>
  <circle cx="598" cy="34" r="3" fill="#48D7F2"/>
  <circle cx="622" cy="34" r="3" fill="#8E83FF" opacity="0.8"/>

  <g id="title-block" transform="translate(64 50)">
    <text x="0" y="20" fill="#48D7F2" font-size="18" font-weight="700"
          letter-spacing="2.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      IOS / OFFLINE TRAINING COMPANION
    </text>
    <text x="0" y="92" fill="#F6F8FB" font-size="68" font-weight="750"
          letter-spacing="-1.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      FitGuide
    </text>
    <text x="0" y="138" fill="#F6F8FB" font-size="29" font-weight="650"
