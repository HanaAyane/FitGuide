<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="720" viewBox="0 0 1200 720"
     role="img" aria-labelledby="title desc">
  <title id="title">FitGuide 训练闭环</title>
  <desc id="desc">从动作库浏览、训练计划、逐组记录、休息计时到训练历史回看的五步流程图。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1C2B"/>
      <stop offset="1" stop-color="#04090F"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48D7F2"/>
      <stop offset="0.56" stop-color="#6EA7FF"/>
      <stop offset="1" stop-color="#8E83FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#background)"/>
  <circle cx="80" cy="690" r="190" fill="#48D7F2" opacity="0.045"/>
  <circle cx="1120" cy="42" r="210" fill="#8E83FF" opacity="0.055"/>
  <text x="56" y="60" fill="#F6F8FB" font-size="48" font-weight="750"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">一次训练的真实闭环</text>
  <text x="58" y="96" fill="#9FB0CA" font-size="22" font-weight="500"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">从发现动作，到留下可回看的记录。每一步都对应 App 中的真实状态。</text>

  <path d="M564 190H636M936 256V314H564M564 378H636M936 444V502H564"
        fill="none" stroke="#7593AE" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M564 190H636M936 256V314H564M564 378H636M936 444V502H564"
        fill="none" stroke="url(#line)" stroke-opacity="0.64" stroke-width="2" stroke-dasharray="4 12"/>
  <circle cx="600" cy="190" r="4" fill="#48D7F2"/>
  <circle cx="600" cy="378" r="4" fill="#8E83FF"/>
  <circle cx="600" cy="502" r="4" fill="#48D7F2"/>
  <g id="step-01">
    <rect x="64" y="128" width="500" height="128" rx="22" fill="#102B3D" stroke="#48D7F2" stroke-opacity="0.34"/>
    <circle cx="108" cy="192" r="34" fill="#0A1E2E" stroke="#48D7F2" stroke-width="2"/>
    <text x="108" y="200" text-anchor="middle" fill="#D6F8FF" font-size="22" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
    <text x="158" y="181" fill="#F6F8FB" font-size="40" font-weight="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">浏览动作</text>
    <text x="160" y="210" fill="#94AEC4" font-size="20" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Browse</text>
    <text x="160" y="238" fill="#B8CAD8" font-size="23" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">1324 个动作 · 双语</text>
  </g>
  <g id="step-02">
    <rect x="636" y="128" width="500" height="128" rx="22" fill="#142B42" stroke="#6EA7FF" stroke-opacity="0.38"/>
    <circle cx="680" cy="192" r="34" fill="#0E2137" stroke="#6EA7FF" stroke-width="2"/>
    <text x="680" y="200" text-anchor="middle" fill="#DCE9FF" font-size="22" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
    <text x="730" y="181" fill="#F6F8FB" font-size="40" font-weight="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">建立计划</text>
    <text x="732" y="210" fill="#94AEC4" font-size="20" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Plan</text>
    <text x="732" y="238" fill="#B8CAD8" font-size="23" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">组数 · 次数 · 休息</text>
  </g>
  <g id="step-03">
    <rect x="64" y="316" width="500" height="128" rx="22" fill="#1B2C4A" stroke="#7C93FF" stroke-opacity="0.40"/>
    <circle cx="108" cy="380" r="34" fill="#151F3E" stroke="#7C93FF" stroke-width="2"/>
    <text x="108" y="388" text-anchor="middle" fill="#E5E4FF" font-size="22" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
    <text x="158" y="369" fill="#F6F8FB" font-size="40" font-weight="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">逐组记录</text>
    <text x="160" y="398" fill="#94AEC4" font-size="20" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Log</text>
    <text x="160" y="426" fill="#B8CAD8" font-size="23" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">重量 · 次数 · 即时保存</text>
  </g>
  <g id="step-04">
    <rect x="636" y="316" width="500" height="128" rx="22" fill="#202B4A" stroke="#8E83FF" stroke-opacity="0.42"/>
    <circle cx="680" cy="380" r="34" fill="#1A203E" stroke="#8E83FF" stroke-width="2"/>
    <text x="680" y="388" text-anchor="middle" fill="#E9E3FF" font-size="22" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text>
    <text x="730" y="369" fill="#F6F8FB" font-size="40" font-weight="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">休息计时</text>
    <text x="732" y="398" fill="#94AEC4" font-size="20" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Rest</text>
    <text x="732" y="426" fill="#B8CAD8" font-size="23" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">+15s · 跳过 · 恢复</text>
  </g>
  <g id="step-05">
    <rect x="64" y="504" width="500" height="128" rx="22" fill="#242747" stroke="#48D7F2" stroke-opacity="0.38"/>
    <circle cx="108" cy="568" r="34" fill="#1A2039" stroke="#48D7F2" stroke-width="2"/>
    <text x="108" y="576" text-anchor="middle" fill="#D6F8FF" font-size="22" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05</text>
    <text x="158" y="557" fill="#F6F8FB" font-size="40" font-weight="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">回看历史</text>
    <text x="160" y="586" fill="#94AEC4" font-size="20" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Review</text>
    <text x="160" y="614" fill="#B8CAD8" font-size="23" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">摘要 · 快照 · 历史</text>
  </g>
  <g transform="translate(700 532)">
    <text x="0" y="20" fill="#C2D4E0" font-size="20" font-weight="650" letter-spacing="1.1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ON-DEVICE / SWIFTDATA</text>
    <text x="0" y="58" fill="#6F8BA5" font-size="18" font-weight="650" letter-spacing="1.1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NO ACCOUNT · NO BACKEND</text>
    <path d="M0 84H360" stroke="#7D98B0" stroke-opacity="0.28"/>
    <text x="0" y="116" fill="#7D98B0" font-size="18" font-weight="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">训练状态、组记录与历史都留在本机。</text>
  </g>
</svg>
