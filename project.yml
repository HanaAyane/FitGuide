name: FitGuide
options:
  bundleIdPrefix: com.local.fitguide
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  FitGuide:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: FitGuide
        excludes:
          - "Info.plist"
      - path: ../exercises-dataset/data
        type: folder
        buildPhase: resources
      - path: ../exercises-dataset/images
        type: folder
        buildPhase: resources
      - path: ../exercises-dataset/videos
        type: folder
        buildPhase: resources
    dependencies:
      - target: FitGuideLiveActivity
        embed: true
    info:
      path: FitGuide/Info.plist
      properties:
        CFBundleDisplayName: FitGuide
        CFBundleName: FitGuide
        CFBundleShortVersionString: "2.0.1"
        CFBundleVersion: "3"
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
  FitGuideLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: FitGuideLiveActivity
        excludes:
          - Info.plist
      - path: FitGuide/Shared/WorkoutLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.fitguide.FitGuide.LiveActivity
        INFOPLIST_FILE: FitGuideLiveActivity/Info.plist
        SKIP_INSTALL: YES
  FitGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitGuideTests
        excludes:
          - Fixtures
      - path: FitGuideTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: FitGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
  FitGuideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitGuideUITests
    dependencies:
      - target: FitGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
