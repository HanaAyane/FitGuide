name: FitGuide
options:
  bundleIdPrefix: com.local.fitguide
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  FitGuide:
    type: application
    platform: iOS
    sources:
      - path: FitGuide
        excludes:
          - "Info.plist"
      - path: ../exercises-dataset/data
        type: folder
        buildPhase: resources
      - path: ../exercises-dataset/images
        type: folder
        buildPhase: resources
      - path: ../exercises-dataset/videos
        type: folder
        buildPhase: resources
    info:
      path: FitGuide/Info.plist
      properties:
        CFBundleDisplayName: FitGuide
        CFBundleName: FitGuide
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
  FitGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitGuideTests
    dependencies:
      - target: FitGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"